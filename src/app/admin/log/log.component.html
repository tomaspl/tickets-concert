<div class="bg-[#fafafa] min-h-screen p-8">
  <div class="max-w-6xl mx-auto">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
      <h2 class="text-2xl font-bold text-cumbres-red">Log de eventos</h2>
      <button [appTailwindClass]="'btn-small-red'" (click)="resetLog()">
        Borrar todos los logs
      </button>
    </div>
    <div class="mb-4 flex items-center justify-start">
      <label for="price" class="text-sm font-medium leading-6 text-gray-900"
        >Filtrar por palabra clave:</label
      >
      <input
        type="text"
        (keyup)="keyUpHandler($event)"
        name="price"
        id="price"
        class="ml-2 my-2 block w-auto rounded-md border-0 px-4 py-2 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 lg:my-4"
      />
    </div>
    <div class="overflow-x-auto rounded-lg shadow">
      <table class="min-w-full table-fixed bg-white text-left">
        <thead>
          <tr>
            <th
              class="w-2/3 px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500"
            >
              Evento
            </th>
            <th
              class="w-1/3 px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500"
            >
              Fecha y hora
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let log of logSearch" class="odd:bg-gray-100">
            <td
              class="w-2/3 break-words px-6 py-4 text-left text-sm text-gray-900"
            >
              {{ log.titulo }}
            </td>
            <td
              class="w-1/3 whitespace-nowrap px-6 py-4 text-left text-sm text-gray-900"
            >
              {{ getTime(log.time) }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
